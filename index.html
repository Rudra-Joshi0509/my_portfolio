<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudra Joshi | Full Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0b;
            --bg-secondary: #111113;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --green: #10b981;
            --text: #ffffff;
            --text-secondary: #a1a1aa;
            --border: rgba(255,255,255,0.08);
            --card: rgba(255,255,255,0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Desktop Custom Cursor */
        @media (min-width: 1025px) and (pointer: fine) {
            * {
                cursor: none !important;
            }
        }

        .desktop-cursor-dot {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100001;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .desktop-cursor-circle {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100000;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease-out, border-color 0.2s ease, width 0.2s ease, height 0.2s ease;
        }

        .desktop-cursor-dot.hovering {
            transform: translate(-50%, -50%) scale(2);
            background: #a855f7;
        }

        .desktop-cursor-circle.hovering {
            width: 60px;
            height: 60px;
            border-color: #a855f7;
        }

        @media (min-width: 1025px) and (pointer: fine) {
            .desktop-cursor-dot,
            .desktop-cursor-circle {
                display: block;
            }
        }

        /* Mobile Touch Cursor */
        .mobile-cursor {
            display: none;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .mobile-cursor.active {
            opacity: 1;
        }

        .mobile-cursor-ripple {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: none;
        }

        .mobile-cursor.active .mobile-cursor-ripple {
            animation: mobileRipple 0.6s ease-out forwards;
        }

        @keyframes mobileRipple {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        .mobile-cursor-center {
            position: absolute;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mobile-cursor.active .mobile-cursor-center {
            transform: translate(-50%, -50%) scale(1);
        }

        .mobile-cursor-ring {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(99, 102, 241, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mobile-cursor.active .mobile-cursor-ring {
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 1024px), (pointer: coarse) {
            .mobile-cursor {
                display: block;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 11, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--accent) !important;
            color: white !important;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* Mobile Menu Button */
        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            padding: 5px;
            cursor: pointer;
            z-index: 1001;
        }

        .mobile-menu-btn span {
            width: 25px;
            height: 2px;
            background: var(--text);
            transition: all 0.3s;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 8%;
            position: relative;
            overflow: hidden;
        }

        .hero-bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        .hero-bg-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            pointer-events: none;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .hero-text {
            max-width: 600px;
        }

        .availability-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            margin-bottom: 30px;
            font-size: 0.85rem;
            color: var(--green);
            font-weight: 500;
        }

        .availability-badge .pulse {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 25px;
            letter-spacing: -2px;
        }

        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .hero-btns {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 36px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            color: white;
            box-shadow: 0 10px 40px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--card);
            color: white;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }

        .social-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.3rem;
            transition: all 0.3s;
        }

        .social-link:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        /* Hero Image */
        .hero-image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .profile-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-ring {
            position: absolute;
            top: -25px;
            left: -25px;
            right: -25px;
            bottom: -25px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            animation: rotateRing 15s linear infinite;
        }

        .profile-ring-2 {
            position: absolute;
            top: -40px;
            left: -40px;
            right: -40px;
            bottom: -40px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 35px;
            animation: rotateRing 20s linear infinite reverse;
        }

        .profile-ring-3 {
            position: absolute;
            top: -55px;
            left: -55px;
            right: -55px;
            bottom: -55px;
            border: 1px dashed rgba(99, 102, 241, 0.3);
            border-radius: 40px;
            animation: rotateRing 25s linear infinite;
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-ring::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
        }

        .profile-ring::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 20%;
            width: 8px;
            height: 8px;
            background: #a855f7;
            border-radius: 50%;
            box-shadow: 0 0 15px #a855f7;
        }

        .profile-ring-2::before {
            content: '';
            position: absolute;
            top: 20%;
            right: -5px;
            width: 10px;
            height: 10px;
            background: #ec4899;
            border-radius: 50%;
            box-shadow: 0 0 15px #ec4899;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: floatParticle 4s ease-in-out infinite;
        }

        .particle-1 { top: 10%; left: -30px; animation-delay: 0s; }
        .particle-2 { top: 30%; right: -25px; background: #a855f7; animation-delay: 1s; }
        .particle-3 { bottom: 20%; left: -20px; background: #ec4899; animation-delay: 2s; }
        .particle-4 { bottom: 40%; right: -35px; animation-delay: 0.5s; }
        .particle-5 { top: 50%; left: -40px; background: #22d3ee; width: 4px; height: 4px; animation-delay: 1.5s; }
        .particle-6 { top: 70%; right: -30px; background: #10b981; width: 5px; height: 5px; animation-delay: 2.5s; }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
        }

        .profile-image {
            width: 380px;
            height: 450px;
            border-radius: 24px;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 3px solid rgba(255,255,255,0.1);
            animation: imageFloat 6s ease-in-out infinite;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }

        .profile-image:hover {
            transform: scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 25px 60px -12px var(--accent-glow);
        }

        @keyframes imageFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .profile-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, var(--accent), #a855f7, #ec4899);
            filter: blur(100px);
            opacity: 0.5;
            z-index: 1;
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }

        .corner-decoration {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid var(--accent);
            z-index: 5;
        }

        .corner-decoration.top-left {
            top: -15px;
            left: -15px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
            animation: cornerPulse 2s ease-in-out infinite;
        }

        .corner-decoration.bottom-right {
            bottom: -15px;
            right: -15px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
            animation: cornerPulse 2s ease-in-out infinite 1s;
        }

        @keyframes cornerPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Quick Stats */
        .quick-stats {
            padding: 60px 8%;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
        }

        .stat-card {
            text-align: center;
            padding: 30px;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 8px;
        }

        /* Section Styles */
        section {
            padding: 120px 8%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 8px 20px;
            border-radius: 50px;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* About Section */
        #about {
            background: var(--bg-secondary);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 80px;
            align-items: center;
        }

        .about-image-wrapper {
            position: relative;
        }

        .about-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        .about-decoration {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            border: 3px solid var(--accent);
            border-radius: 20px;
        }

        .about-content h3 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .about-content p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .about-content strong {
            color: var(--text);
        }

        .why-hire-me {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .why-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: all 0.3s;
        }

        .why-item:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .why-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .why-text h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .why-text p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
        }

        /* Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
        }

        .skill-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            transform: scaleX(0);
            transition: transform 0.4s;
        }

        .skill-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
        }

        .skill-card:hover::before {
            transform: scaleX(1);
        }

        .skill-icon {
            font-size: 2.8rem;
            margin-bottom: 15px;
        }

        .skill-card h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .skill-card span {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Projects Section */
        #projects {
            background: var(--bg-secondary);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .project-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s;
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .project-image {
            height: 200px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .project-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .project-card:hover .project-image::after {
            opacity: 0.2;
        }

        .project-content {
            padding: 30px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .project-tag {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .project-content h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .project-content p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .project-links {
            display: flex;
            gap: 15px;
        }

        .project-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: gap 0.3s;
        }

        .project-link:hover {
            gap: 12px;

            padding: 50px;

        .form-group {

        .submit-btn:hover {
            transform: translateY(-3px);
